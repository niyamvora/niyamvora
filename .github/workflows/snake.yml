name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: niyamvora
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2563eb&color_dots=#f4f4f5,#d4d4d8,#a1a1aa,#71717a,#3f3f46
            dist/github-contribution-grid-snake-dark.svg?color_snake=#3b82f6&color_dots=#18181b,#3f3f46,#71717a,#a1a1aa,#e4e4e7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
